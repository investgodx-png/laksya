<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Lakshya — Goal & Debt Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%234f46e5'/><circle cx='12' cy='12' r='5' fill='none' stroke='white' stroke-width='2'/><circle cx='12' cy='12' r='1.4' fill='white'/></svg>">
</head>
<body>
<div id="app">
  <header id="appbar">
    <div class="brand">
      <span class="brand-logo" id="brandLogo"></span>
      <div>
        <div class="brand-name">Lakshya</div>
        <div class="brand-sub" id="brandSub">Goals &amp; Debts</div>
      </div>
    </div>
    <div class="streak-chip" id="streakChip" title="Current streak"></div>
  </header>

  <main id="main">
    <section class="page" id="page-home" data-title="Home"></section>
    <section class="page" id="page-goals" data-title="Daily Goals"></section>
    <section class="page" id="page-debts" data-title="Debts"></section>
    <section class="page" id="page-history" data-title="History"></section>
    <section class="page" id="page-settings" data-title="Settings"></section>
  </main>

  <div id="dock">
    <div class="dock-inner">
      <button id="fab" aria-label="Quick add"></button>
      <nav id="bottomnav"></nav>
    </div>
  </div>
</div>

<div id="sheetBackdrop">
  <div id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h3 id="sheetTitle"></h3>
      <button class="icon-btn" id="sheetClose" aria-label="Close"></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
